name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publier la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Archiver le build web
        run: cd dist && zip -r "../youmbo-tv-web-${GITHUB_REF_NAME}.zip" .
      # Le paquet Tizen (.wgt signé) sera ajouté ici dans la PR dédiée à la TV.
      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "youmbo-tv-web-${GITHUB_REF_NAME}.zip" --generate-notes
